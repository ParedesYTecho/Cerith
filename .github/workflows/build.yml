name: Build and Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Cerith.sln

      - name: Build
        run: dotnet build Cerith.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Cerith.sln --configuration Release --no-build --verbosity normal
