name: Build and Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Cerith.sln

      - name: Build
        run: dotnet build Cerith.sln --configuration Release --no-restore

      - name: Test Core contracts
        run: dotnet test tests/Cerith.Core.Tests/Cerith.Core.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Test empty Telemetry project (temporary ZeroTests allowance)
        run: dotnet test tests/Cerith.Telemetry.Tests/Cerith.Telemetry.Tests.csproj --configuration Release --no-build --verbosity normal -- --ignore-exit-code 8

      - name: Test empty Integration project (temporary ZeroTests allowance)
        run: dotnet test tests/Cerith.Integration.Tests/Cerith.Integration.Tests.csproj --configuration Release --no-build --verbosity normal -- --ignore-exit-code 8
