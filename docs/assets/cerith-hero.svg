<text x="266" y="259" font-size="13" letter-spacing="6.2" font-family="Segoe UI, Arial, sans-serif" fill="#e1d7c9">SYSTEM INTELLIGENCE</text>
<text x="268" y="307" font-size="20" letter-spacing=".2" font-family="Segoe UI, Arial, sans-serif" fill="#cad4d7">Any metric. Any design. Anywhere on your desktop.</text>
