<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc">
<title id="title">Cerith — an editorial orbital identity</title>
<desc id="desc">An ivory orbital symbol and Cerith wordmark on midnight blue, with a luminous planetary arc and the line Any metric. Any design. Anywhere on your desktop.</desc>
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d13"/><stop offset=".55" stop-color="#111d29"/><stop offset="1" stop-color="#080d12"/></linearGradient>
  <radialGradient id="glow" cx=".78" cy=".22" r=".75"><stop stop-color="#46606c" stop-opacity=".44"/><stop offset=".45" stop-color="#1b3543" stop-opacity=".14"/><stop offset="1" stop-color="#071018" stop-opacity="0"/></radialGradient>
  <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f5ec"/><stop offset=".55" stop-color="#e5d6c4"/><stop offset="1" stop-color="#b79d81"/></linearGradient>
  <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d9b68b" stop-opacity="0"/><stop offset=".5" stop-color="#f7dfbd" stop-opacity=".95"/><stop offset="1" stop-color="#fff1d8" stop-opacity=".10"/></linearGradient>
  <filter id="bloom" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="13"/></filter>
  <pattern id="grid" width="62" height="62" patternUnits="userSpaceOnUse"><path d="M62 0H0V62" fill="none" stroke="#b7cbd5" stroke-opacity=".055" stroke-width="1"/></pattern>
</defs>
