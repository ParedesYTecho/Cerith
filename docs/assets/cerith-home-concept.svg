<title id="title">Cerith Home — visual concept</title>
<desc id="desc">A conceptual dark Cerith dashboard with a navigation rail, five hardware metric cards, and Claude and ChatGPT quota cards. All displayed values are sample illustrations, not measured telemetry or a product screenshot.</desc>
