  <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#29e0cd"/><stop offset="1" stop-color="#71efdf"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="13" stdDeviation="21" flood-color="#000" flood-opacity=".44"/></filter>
</defs>
